<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Circular Billiards: Trajectory + Caustic + Animated Particle</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 24px; background: #fafafa; color: #111; }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .panel { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: end;
      padding: 12px; background: #fff; border: 1px solid #e6e6e6; border-radius: 12px;
    }
    label { display: grid; gap: 6px; font-size: 13px; }
    input[type="text"], input[type="number"]{
      padding: 10px 12px; border: 1px solid #d8d8d8; border-radius: 10px; font-size: 14px;
      width: 240px;
    }
    .check {
      display: flex; gap: 8px; align-items: center; font-size: 13px; user-select: none;
      padding: 10px 12px; border: 1px solid #d8d8d8; border-radius: 10px; background: #fff;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button {
      padding: 10px 14px; border: 1px solid #d8d8d8; border-radius: 10px;
      background: #111; color: #fff; font-size: 14px; cursor: pointer;
    }
    button.secondary { background: #fff; color: #111; }
    button:active { transform: translateY(1px); }
    .hint { font-size: 13px; color: #444; margin-top: 6px; }
    .err { color: #b00020; font-size: 13px; margin-top: 6px; min-height: 1em; }
    canvas {
      width: 100%; height: auto; background: #fff;
      border: 1px solid #e6e6e6; border-radius: 12px;
    }
    .footer { font-size: 12px; color: #555; margin-top: 10px; }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Circular Billiards (Trajectory + Caustic + Animated Particle)</h1>

  <div class="panel">
    <div class="controls">
      <label>
        Angle (radians, from tangent)
        <input id="angle" type="text" value="pi/4" placeholder="e.g. pi/3, 0.7, sqrt(2)/5" />
      </label>

      <label>
        Number of bounces
        <input id="bounces" type="number" min="1" step="1" value="250" />
      </label>

      <label>
        Particle speed (units/sec)
        <input id="speed" type="number" min="0.05" step="0.05" value="0.9" />
      </label>

      <div class="row">
        <label class="check" title="Choose a random starting boundary point each draw.">
          <input id="randomStart" type="checkbox" checked />
          Random start point
        </label>

        <button id="randomizeStartBtn" class="secondary" title="Pick a new random start point and redraw.">
          Randomize start
        </button>

        <button id="randomizeParticleBtn" class="secondary" title="Place the particle at a random location along the orbit.">
          Randomize particle
        </button>

        <button id="playPauseBtn">Pause</button>

        <button id="drawBtn">Draw</button>
      </div>

      <div style="flex-basis:100%"></div>
      <div class="hint">
        Try: <code>pi/3</code>, <code>pi/4</code>, <code>sqrt(2)/5</code>, <code>pi/2</code>.
      </div>
      <div id="err" class="err"></div>
    </div>

    <canvas id="cv" width="900" height="900"></canvas>

    <div class="footer">
      Unit circle billiard with specular reflection. Caustic radius is <code>cos(angle)</code>. Particle moves along the computed polyline at constant arc-length speed.
    </div>
  </div>
</div>

<script>
/** --- Vector helpers --- **/
function dot(a,b){ return a[0]*b[0] + a[1]*b[1]; }
function norm(a){ return Math.hypot(a[0], a[1]); }
function scale(a,s){ return [a[0]*s, a[1]*s]; }
function add(a,b){ return [a[0]+b[0], a[1]+b[1]]; }
function sub(a,b){ return [a[0]-b[0], a[1]-b[1]]; }
function unit(a){
  const n = norm(a);
  return n === 0 ? [0,0] : [a[0]/n, a[1]/n];
}
function reflect(v, nUnit){
  const vn = dot(v, nUnit);
  return sub(v, scale(nUnit, 2*vn));
}

/** --- Expression parser for angle --- **/
function parseAngle(expr){
  const allowed = { pi: Math.PI, sqrt: Math.sqrt, sin: Math.sin, cos: Math.cos };
  if (!/^[0-9+\-*/().\s a-zA-Z]+$/.test(expr)) {
    throw new Error("Angle contains invalid characters.");
  }
  expr = expr.replace(/\bPI\b/g, "pi").replace(/\bPi\b/g, "pi");
  const fn = new Function("pi","sqrt","sin","cos", `return (${expr});`);
  const val = fn(allowed.pi, allowed.sqrt, allowed.sin, allowed.cos);
  if (!Number.isFinite(val)) throw new Error("Angle did not evaluate to a finite number.");
  return val;
}

/** --- Core billiard simulation (unit circle) --- **/
function simulate(angleRad, bounces, startAngleRad){
  if (!(angleRad > 0 && angleRad <= Math.PI/2 + 1e-14)) {
    throw new Error("Angle must be in (0, pi/2].");
  }
  if (!(Number.isInteger(bounces) && bounces >= 1)) {
    throw new Error("Bounces must be a positive integer.");
  }

  const R = 1.0;

  // Start point on boundary
  let p = [Math.cos(startAngleRad)*R, Math.sin(startAngleRad)*R];

  // Tangent (CCW) and inward normal at start
  const tangent = [-Math.sin(startAngleRad), Math.cos(startAngleRad)];
  const inward = unit(scale(p, -1));

  // Initial direction: rotate tangent toward inward by angleRad
  let d = unit(add(scale(tangent, Math.cos(angleRad)), scale(inward, Math.sin(angleRad))));

  const pts = [p];

  for (let i=0; i<bounces; i++){
    // Next intersection with circle: t = -2 (p·d) since |p|=1
    const pd = dot(p, d);
    let t = -2 * pd;
    if (t <= 1e-12) t = 1e-12;

    const q = add(p, scale(d, t));
    const n = unit(q);       // outward normal
    d = unit(reflect(d, n)); // specular reflection
    p = q;
    pts.push(p);
  }

  const causticRadius = Math.cos(angleRad) * R;
  return { pts, causticRadius };
}

/** --- Build arc-length parameterization for particle motion --- **/
function buildArc(pts){
  // Returns cumulative lengths s[i] (s[0]=0), segment lengths, total length
  const s = new Array(pts.length).fill(0);
  let total = 0;
  for (let i=1; i<pts.length; i++){
    const dx = pts[i][0] - pts[i-1][0];
    const dy = pts[i][1] - pts[i-1][1];
    const L = Math.hypot(dx, dy);
    total += L;
    s[i] = total;
  }
  return { s, total };
}

function pointAtArc(pts, sArr, total, u){
  // u in [0, total): returns point along polyline
  // Wrap around
  let t = u % total;
  if (t < 0) t += total;

  // Find segment by linear scan (fine for a few hundred bounces)
  let i = 1;
  while (i < sArr.length && sArr[i] < t) i++;

  if (i >= sArr.length) return pts[pts.length - 1];

  const s0 = sArr[i-1];
  const s1 = sArr[i];
  const segLen = s1 - s0;
  const w = segLen > 0 ? (t - s0) / segLen : 0;

  const p0 = pts[i-1], p1 = pts[i];
  return [p0[0] + w*(p1[0]-p0[0]), p0[1] + w*(p1[1]-p0[1])];
}

/** --- Drawing --- **/
function drawScene(state){
  const { pts, causticRadius, particlePos } = state;

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;

  ctx.clearRect(0,0,W,H);

  const pad = 40;
  const cx = W/2, cy = H/2;
  const scalePix = Math.min(W,H)/2 - pad;

  function toXY(p){
    return [cx + p[0]*scalePix, cy - p[1]*scalePix];
  }

  // background
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,W,H);

  // outer circle
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, scalePix, 0, 2*Math.PI);
  ctx.stroke();

  // caustic (dashed)
  ctx.strokeStyle = "#444";
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(0, causticRadius)*scalePix, 0, 2*Math.PI);
  ctx.stroke();
  ctx.setLineDash([]);

  // trajectory
  ctx.strokeStyle = "#0a0a0a";
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  const [x0,y0] = toXY(pts[0]);
  ctx.moveTo(x0,y0);
  for (let i=1; i<pts.length; i++){
    const [x,y] = toXY(pts[i]);
    ctx.lineTo(x,y);
  }
  ctx.stroke();

  // collision point markers (first few)
  ctx.fillStyle = "#111";
  for (let i=0; i<Math.min(pts.length, 6); i++){
    const [x,y] = toXY(pts[i]);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, 2*Math.PI);
    ctx.fill();
  }

  // particle
  const [px, py] = toXY(particlePos);
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(px, py, 7, 0, 2*Math.PI);
  ctx.fill();
}

/** --- UI + animation state --- **/
let currentStartAngle = Math.random() * 2*Math.PI;

let simState = null;    // { pts, causticRadius, arcS, arcTotal, u }
let playing = true;
let lastTime = null;

function rebuildSimulation(forceNewRandomStart=false){
  const errEl = document.getElementById("err");
  errEl.textContent = "";

  try{
    const angleExpr = document.getElementById("angle").value.trim();
    const bounces = parseInt(document.getElementById("bounces").value, 10);
    const angleRad = parseAngle(angleExpr);

    const useRandomStart = document.getElementById("randomStart").checked;
    if (useRandomStart && (forceNewRandomStart || currentStartAngle == null)) {
      currentStartAngle = Math.random() * 2*Math.PI;
    }
    if (!useRandomStart) currentStartAngle = 0.0;

    const { pts, causticRadius } = simulate(angleRad, bounces, currentStartAngle);
    const { s: arcS, total: arcTotal } = buildArc(pts);

    // start particle at a random arc-length location
    const u0 = Math.random() * arcTotal;

    simState = { pts, causticRadius, arcS, arcTotal, u: u0 };

    // draw initial frame
    const particlePos = pointAtArc(pts, arcS, arcTotal, simState.u);
    drawScene({ pts, causticRadius, particlePos });

  } catch(e){
    simState = null;
    errEl.textContent = e.message || String(e);
  }
}

function randomizeParticle(){
  if (!simState) return;
  simState.u = Math.random() * simState.arcTotal;
}

function tick(ts){
  if (lastTime == null) lastTime = ts;
  const dt = (ts - lastTime) / 1000.0;
  lastTime = ts;

  if (simState){
    const speed = Math.max(0, parseFloat(document.getElementById("speed").value || "0.9"));
    if (playing){
      simState.u += speed * dt; // arc-length per second
    }
    const particlePos = pointAtArc(simState.pts, simState.arcS, simState.arcTotal, simState.u);
    drawScene({ pts: simState.pts, causticRadius: simState.causticRadius, particlePos });
  }

  requestAnimationFrame(tick);
}

/** --- Wire up controls --- **/
document.getElementById("drawBtn").addEventListener("click", ()=>rebuildSimulation(false));
document.getElementById("randomizeStartBtn").addEventListener("click", ()=>rebuildSimulation(true));
document.getElementById("randomizeParticleBtn").addEventListener("click", ()=>{
  randomizeParticle();
});

document.getElementById("playPauseBtn").addEventListener("click", ()=>{
  playing = !playing;
  document.getElementById("playPauseBtn").textContent = playing ? "Pause" : "Play";
});

document.getElementById("randomStart").addEventListener("change", ()=>rebuildSimulation(false));
document.getElementById("angle").addEventListener("keydown", (ev)=>{ if(ev.key==="Enter") rebuildSimulation(false); });
document.getElementById("bounces").addEventListener("keydown", (ev)=>{ if(ev.key==="Enter") rebuildSimulation(false); });

/** --- Start --- **/
rebuildSimulation(true);
requestAnimationFrame(tick);
</script>
</body>
</html>
