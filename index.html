<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Circular Billiard Demo</title>
<style>
body { font-family: system-ui; padding:20px; background:#fafafa; }
.controls { margin-bottom:15px; }
input { padding:6px; margin-right:10px; }
button { padding:6px 12px; }
canvas { background:white; border:1px solid #ccc; }
</style>
</head>
<body>

<h2>Circular Billiards</h2>

<div class="controls">
  Angle (radians):
  <input id="angle" value="pi/4">
  Bounces:
  <input id="bounces" type="number" value="200">
  Speed:
  <input id="speed" type="number" value="0.8" step="0.1">
  <button onclick="start()">Draw</button>
</div>

<canvas id="cv" width="700" height="700"></canvas>

<script>
/* ---------- Utilities ---------- */

function parseAngle(expr){
  expr = expr.replace(/pi/g, Math.PI);
  return eval(expr);
}

function dot(a,b){ return a[0]*b[0]+a[1]*b[1]; }
function norm(a){ return Math.hypot(a[0],a[1]); }
function unit(a){ let n=norm(a); return [a[0]/n,a[1]/n]; }
function reflect(v,n){ return [v[0]-2*dot(v,n)*n[0], v[1]-2*dot(v,n)*n[1]]; }

/* ---------- Simulation ---------- */

let sim=null;
let playing=true;
let lastTime=null;

function randomInterior(){
  let r=Math.sqrt(Math.random())*0.95;
  let t=Math.random()*2*Math.PI;
  return [r*Math.cos(t), r*Math.sin(t)];
}

function simulate(angle,bounces){

  let p=randomInterior();
  let phi=0; // fixed direction seed

  let tangent=[-Math.sin(phi), Math.cos(phi)];
  let inward=[-Math.cos(phi), -Math.sin(phi)];

  let d=unit([
    Math.cos(angle)*tangent[0]+Math.sin(angle)*inward[0],
    Math.cos(angle)*tangent[1]+Math.sin(angle)*inward[1]
  ]);

  // Correct caustic radius
  let caustic=Math.abs(p[0]*d[1]-p[1]*d[0]);

  let pts=[p];

  // first hit
  let pd=dot(p,d);
  let disc=pd*pd+(1-dot(p,p));
  let tHit=-pd+Math.sqrt(disc);
  p=[p[0]+tHit*d[0], p[1]+tHit*d[1]];
  pts.push(p);

  for(let i=1;i<bounces;i++){
    let n=unit(p);
    d=unit(reflect(d,n));
    let t=-2*dot(p,d);
    p=[p[0]+t*d[0], p[1]+t*d[1]];
    pts.push(p);
  }

  return {pts,caustic};
}

/* ---------- Arc length ---------- */

function buildArc(pts){
  let s=[0], total=0;
  for(let i=1;i<pts.length;i++){
    let dx=pts[i][0]-pts[i-1][0];
    let dy=pts[i][1]-pts[i-1][1];
    total+=Math.hypot(dx,dy);
    s.push(total);
  }
  return {s,total};
}

function pointAt(pts,s,total,u){
  u=u%total;
  let i=1;
  while(i<s.length && s[i]<u) i++;
  if(i>=s.length) return pts[pts.length-1];
  let w=(u-s[i-1])/(s[i]-s[i-1]);
  return [
    pts[i-1][0]+w*(pts[i][0]-pts[i-1][0]),
    pts[i-1][1]+w*(pts[i][1]-pts[i-1][1])
  ];
}

/* ---------- Drawing ---------- */

function draw(){
  let ctx=cv.getContext("2d");
  ctx.clearRect(0,0,700,700);

  let cx=350, cy=350, R=300;

  function map(p){ return [cx+p[0]*R, cy-p[1]*R]; }

  // boundary
  ctx.lineWidth=3;
  ctx.strokeStyle="#000";
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,2*Math.PI);
  ctx.stroke();

  if(!sim) return;

  // caustic
  ctx.setLineDash([8,6]);
  ctx.strokeStyle="green";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(cx,cy,sim.caustic*R,0,2*Math.PI);
  ctx.stroke();
  ctx.setLineDash([]);

  // traced orbit
  ctx.strokeStyle="blue";
  ctx.lineWidth=2;
  ctx.beginPath();
  let traced=sim.pts.slice(0,sim.index+1);
  let m0=map(traced[0]);
  ctx.moveTo(m0[0],m0[1]);
  for(let i=1;i<traced.length;i++){
    let m=map(traced[i]);
    ctx.lineTo(m[0],m[1]);
  }
  ctx.stroke();

  // particle
  let pos=pointAt(sim.pts,sim.arc.s,sim.arc.total,sim.u);
  let m=map(pos);
  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(m[0],m[1],6,0,2*Math.PI);
  ctx.fill();
}

/* ---------- Animation ---------- */

function animate(ts){
  if(!lastTime) lastTime=ts;
  let dt=(ts-lastTime)/1000;
  lastTime=ts;

  if(sim && playing){
    sim.u+=sim.speed*dt;
    sim.index=Math.floor(sim.u/sim.arc.total*(sim.pts.length-1));
  }

  draw();
  requestAnimationFrame(animate);
}

/* ---------- Start ---------- */

function start(){
  let angle=parseAngle(document.getElementById("angle").value);
  let bounces=parseInt(document.getElementById("bounces").value);
  let speed=parseFloat(document.getElementById("speed").value);

  let result=simulate(angle,bounces);
  let arc=buildArc(result.pts);

  sim={
    pts:result.pts,
    caustic:result.caustic,
    arc:arc,
    u:0,
    speed:speed,
    index:0
  };
}

start();
requestAnimationFrame(animate);

</script>
</body>
</html>
