<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Circular Billiards: Orbit + Caustic + Animated Particle</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 24px; background: #fafafa; color: #111; }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .panel { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .controls{
      display:flex; flex-wrap:wrap; gap:12px; align-items:end;
      padding:12px; background:#fff; border:1px solid #e6e6e6; border-radius:12px;
    }
    label{ display:grid; gap:6px; font-size:13px; }
    input[type="text"], input[type="number"]{
      padding:10px 12px; border:1px solid #d8d8d8; border-radius:10px; font-size:14px;
      width:240px;
    }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .check{
      display:flex; gap:8px; align-items:center; font-size:13px; user-select:none;
      padding:10px 12px; border:1px solid #d8d8d8; border-radius:10px; background:#fff;
    }
    button{
      padding:10px 14px; border:1px solid #d8d8d8; border-radius:10px;
      background:#111; color:#fff; font-size:14px; cursor:pointer;
    }
    button.secondary{ background:#fff; color:#111; }
    button:active{ transform:translateY(1px); }
    .hint{ font-size:13px; color:#444; margin-top:6px; }
    .err{ color:#b00020; font-size:13px; margin-top:6px; min-height:1em; }
    canvas{
      width:100%; height:auto; background:#fff;
      border:1px solid #e6e6e6; border-radius:12px;
    }
    .footer{ font-size:12px; color:#555; margin-top:10px; }
    code{ background:#f2f2f2; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Circular Billiards (🔵 orbit, 🟢 caustic, 🔴 particle)</h1>

  <div class="panel">
    <div class="controls">
      <label>
        Angle (radians, from tangent)
        <input id="angle" type="text" value="pi/4" placeholder="e.g. pi/3, 0.7, sqrt(2)/5" />
      </label>

      <label>
        Number of bounces
        <input id="bounces" type="number" min="1" step="1" value="250" />
      </label>

      <label>
        Particle speed (units/sec)
        <input id="speed" type="number" min="0.05" step="0.05" value="0.9" />
      </label>

      <div class="row">
        <label class="check" title="Random starting boundary angle used to set the initial direction.">
          <input id="randomBoundaryDir" type="checkbox" checked />
          Random direction seed
        </label>

        <button id="randomizeBtn" class="secondary" title="New random interior start + direction seed.">
          Randomize
        </button>

        <button id="randomizeParticleBtn" class="secondary" title="Place particle at a random point along the already-computed path.">
          Randomize particle
        </button>

        <button id="playPauseBtn">Pause</button>

        <button id="drawBtn">Draw</button>
      </div>

      <div style="flex-basis:100%"></div>
      <div class="hint">
        Try: <code>pi/3</code>, <code>pi/4</code>, <code>sqrt(2)/5</code>, <code>pi/2</code>.
        Angle must be in <code>(0, pi/2]</code>.
      </div>
      <div id="err" class="err"></div>
    </div>

    <canvas id="cv" width="900" height="900"></canvas>

    <div class="footer">
      Particle starts at a random point inside the disk, moves to the boundary, then reflects.
      Caustic shown has radius <code>cos(angle)</code>.
    </div>
  </div>
</div>

<script>
/** --- Vector helpers --- **/
function dot(a,b){ return a[0]*b[0] + a[1]*b[1]; }
function norm(a){ return Math.hypot(a[0], a[1]); }
function scale(a,s){ return [a[0]*s, a[1]*s]; }
function add(a,b){ return [a[0]+b[0], a[1]+b[1]]; }
function sub(a,b){ return [a[0]-b[0], a[1]-b[1]]; }
function unit(a){
  const n = norm(a);
  return n === 0 ? [0,0] : [a[0]/n, a[1]/n];
}
function reflect(v, nUnit){
  const vn = dot(v, nUnit);
  return sub(v, scale(nUnit, 2*vn));
}

/** --- Parse angle expression like pi/3, sqrt(2)/5 --- **/
function parseAngle(expr){
  const allowed = { pi: Math.PI, sqrt: Math.sqrt, sin: Math.sin, cos: Math.cos };
  if (!/^[0-9+\-*/().\s a-zA-Z]+$/.test(expr)) {
    throw new Error("Angle contains invalid characters.");
  }
  expr = expr.replace(/\bPI\b/g, "pi").replace(/\bPi\b/g, "pi");
  const fn = new Function("pi","sqrt","sin","cos", `return (${expr});`);
  const val = fn(allowed.pi, allowed.sqrt, allowed.sin, allowed.cos);
  if (!Number.isFinite(val)) throw new Error("Angle did not evaluate to a finite number.");
  return val;
}

/** --- Simulate from an INTERIOR start point --- **/
function simulateFromInterior(angleRad, bounces, startPoint, boundarySeedAngleRad){
  if (!(angleRad > 0 && angleRad <= Math.PI/2 + 1e-14)) {
    throw new Error("Angle must be in (0, pi/2].");
  }
  if (!(Number.isInteger(bounces) && bounces >= 1)) {
    throw new Error("Bounces must be a positive integer.");
  }
  const R = 1.0;
  if (norm(startPoint) >= R) {
    throw new Error("Start point must be strictly inside the circle.");
  }

  // Define initial direction using a "seed" boundary angle phi:
  // tangent(phi) rotated toward inward(phi) by angleRad.
  const phi = boundarySeedAngleRad;
  const tangent = [-Math.sin(phi), Math.cos(phi)];
  const inwardAtPhi = [-Math.cos(phi), -Math.sin(phi)];
  let d = unit(add(scale(tangent, Math.cos(angleRad)), scale(inwardAtPhi, Math.sin(angleRad))));

  // First intersection from interior: solve |p + t d|^2 = 1 for t>0, with |d|=1
  let p = startPoint.slice();
  const pd = dot(p, d);
  const disc = pd*pd + (R*R - dot(p,p));
  if (disc <= 0) throw new Error("No boundary intersection found (numerical issue).");
  const tHit = -pd + Math.sqrt(disc);

  let q = add(p, scale(d, tHit));
  const pts = [p, q];

  // Reflect and continue
  let n = unit(q);       // outward normal at boundary point
  d = unit(reflect(d, n));
  p = q;

  for (let i=1; i<bounces; i++){
    const pd2 = dot(p, d);
    let t = -2 * pd2;    // since p is on boundary now (unit circle)
    if (t <= 1e-12) t = 1e-12;
    q = add(p, scale(d, t));
    n = unit(q);
    d = unit(reflect(d, n));
    p = q;
    pts.push(p);
  }

  const causticRadius = Math.cos(angleRad) * R;
  return { pts, causticRadius };
}

/** --- Arc-length parameterization for animation --- **/
function buildArc(pts){
  const s = new Array(pts.length).fill(0);
  let total = 0;
  for (let i=1; i<pts.length; i++){
    const dx = pts[i][0] - pts[i-1][0];
    const dy = pts[i][1] - pts[i-1][1];
    const L = Math.hypot(dx, dy);
    total += L;
    s[i] = total;
  }
  return { s, total: Math.max(total, 1e-12) };
}

function pointAtArc(pts, sArr, total, u){
  let t = u % total;
  if (t < 0) t += total;

  let i = 1;
  while (i < sArr.length && sArr[i] < t) i++;
  if (i >= sArr.length) return pts[pts.length - 1];

  const s0 = sArr[i-1], s1 = sArr[i];
  const segLen = s1 - s0;
  const w = segLen > 0 ? (t - s0) / segLen : 0;

  const p0 = pts[i-1], p1 = pts[i];
  return [p0[0] + w*(p1[0]-p0[0]), p0[1] + w*(p1[1]-p0[1])];
}

/** --- Draw (🔵 orbit, 🟢 caustic, 🔴 particle) --- **/
function drawScene(state){
  const { pts, causticRadius, particlePos } = state;

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;

  ctx.clearRect(0,0,W,H);

  const pad = 40;
  const cx = W/2, cy = H/2;
  const scalePix = Math.min(W,H)/2 - pad;

  function toXY(p){
    return [cx + p[0]*scalePix, cy - p[1]*scalePix];
  }

  // background
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,W,H);

  // boundary
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, scalePix, 0, 2*Math.PI);
  ctx.stroke();

  // 🟢 caustic
  ctx.strokeStyle = "green";
  ctx.lineWidth = 2.5;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(0, causticRadius)*scalePix, 0, 2*Math.PI);
  ctx.stroke();
  ctx.setLineDash([]);

  // 🔵 orbit polyline
  ctx.strokeStyle = "blue";
  ctx.lineWidth = 2;
  ctx.beginPath();
  const [x0,y0] = toXY(pts[0]);
  ctx.moveTo(x0,y0);
  for (let i=1; i<pts.length; i++){
    const [x,y] = toXY(pts[i]);
    ctx.lineTo(x,y);
  }
  ctx.stroke();

  // 🔴 particle
  const [px, py] = toXY(particlePos);
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(px, py, 8, 0, 2*Math.PI);
  ctx.fill();
}

/** --- UI + animation state --- **/
let simState = null;   // { pts, causticRadius, arcS, arcTotal, u }
let playing = true;
let lastTime = null;

function randomInteriorPoint(){
  // uniform-ish in disk via r = sqrt(U)
  const u = Math.random();
  const r = Math.sqrt(u) * 0.98; // keep safely inside
  const th = Math.random() * 2*Math.PI;
  return [r*Math.cos(th), r*Math.sin(th)];
}

function rebuildSimulation(forceRandomizeAll=false){
  const errEl = document.getElementById("err");
  errEl.textContent = "";

  try{
    const angleExpr = document.getElementById("angle").value.trim();
    const bounces = parseInt(document.getElementById("bounces").value, 10);
    const speed = Math.max(0, parseFloat(document.getElementById("speed").value || "0.9"));
    if (!Number.isFinite(speed)) throw new Error("Speed must be a number.");

    const angleRad = parseAngle(angleExpr);

    // start point inside disk
    const startPoint = randomInteriorPoint();

    // direction seed: random boundary angle unless unchecked (fixed at 0)
    const useRandomDir = document.getElementById("randomBoundaryDir").checked;
    const boundarySeed = useRandomDir ? (Math.random() * 2*Math.PI) : 0.0;

    const { pts, causticRadius } = simulateFromInterior(angleRad, bounces, startPoint, boundarySeed);
    const { s: arcS, total: arcTotal } = buildArc(pts);

    // Start particle at the interior start point (u = 0), so you see it trace the orbit from the inside
    simState = { pts, causticRadius, arcS, arcTotal, u: 0.0, speed };

    // draw initial frame
    const particlePos = pointAtArc(pts, arcS, arcTotal, simState.u);
    drawScene({ pts, causticRadius, particlePos });

  } catch(e){
    simState = null;
    errEl.textContent = e.message || String(e);
  }
}

function randomizeParticle(){
  if (!simState) return;
  simState.u = Math.random() * simState.arcTotal;
}

function tick(ts){
  if (lastTime == null) lastTime = ts;
  const dt = (ts - lastTime) / 1000.0;
  lastTime = ts;

  if (simState){
    const speed = Math.max(0, parseFloat(document.getElementById("speed").value || "0.9"));
    if (playing){
      simState.u += speed * dt;
    }
    const particlePos = pointAtArc(simState.pts, simState.arcS, simState.arcTotal, simState.u);
    drawScene({ pts: simState.pts, causticRadius: simState.causticRadius, particlePos });
  }

  requestAnimationFrame(tick);
}

/** --- Wire controls --- **/
document.getElementById("drawBtn").addEventListener("click", ()=>rebuildSimulation(false));
document.getElementById("randomizeBtn").addEventListener("click", ()=>rebuildSimulation(true));
document.getElementById("randomizeParticleBtn").addEventListener("click", ()=>randomizeParticle());

document.getElementById("playPauseBtn").addEventListener("click", ()=>{
  playing = !playing;
  document.getElementById("playPauseBtn").textContent = playing ? "Pause" : "Play";
});

document.getElementById("angle").addEventListener("keydown", (ev)=>{ if(ev.key==="Enter") rebuildSimulation(false); });
document.getElementById("bounces").addEventListener("keydown", (ev)=>{ if(ev.key==="Enter") rebuildSimulation(false); });

/** --- Start --- **/
rebuildSimulation(true);
requestAnimationFrame(tick);
</script>
</body>
</html>
