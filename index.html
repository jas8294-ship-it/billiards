<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Circular Billiards: Trace Orbit + Caustic</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 24px; background: #fafafa; color: #111; }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .controls{
      display:flex; flex-wrap:wrap; gap:12px; align-items:end;
      padding:12px; background:#fff; border:1px solid #e6e6e6; border-radius:12px;
      margin-bottom: 12px;
    }
    label{ display:grid; gap:6px; font-size:13px; }
    input[type="text"], input[type="number"]{
      padding:10px 12px; border:1px solid #d8d8d8; border-radius:10px; font-size:14px;
      width:240px;
    }
    button{
      padding:10px 14px; border:1px solid #d8d8d8; border-radius:10px;
      background:#111; color:#fff; font-size:14px; cursor:pointer;
    }
    .hint{ font-size:13px; color:#444; margin-top:6px; flex-basis:100%; }
    .err{ color:#b00020; font-size:13px; margin-top:6px; min-height:1em; flex-basis:100%; }
    canvas{
      width:100%; height:auto; background:#fff;
      border:1px solid #e6e6e6; border-radius:12px;
    }
    code{ background:#f2f2f2; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Circular Billiards (🔵 traced orbit, 🟢 caustic, 🔴 particle)</h1>

  <div class="controls">
    <label>
      Angle α (radians, measured from tangent at impact)
      <input id="angle" type="text" value="pi/4" />
    </label>

    <label>
      Number of bounces
      <input id="bounces" type="number" min="1" step="1" value="200" />
    </label>

    <label>
      Particle speed (units/sec)
      <input id="speed" type="number" min="0.05" step="0.05" value="0.9" />
    </label>

    <button id="drawBtn">Draw</button>

    <div class="hint">
      Try: <code>pi/3</code> (triangle), <code>pi/4</code> (square), <code>pi/5</code> (pentagon), <code>sqrt(2)/5</code> (typically nonperiodic-looking).
      Must have <code>0 &lt; α ≤ pi/2</code>.
    </div>
    <div id="err" class="err"></div>
  </div>

  <canvas id="cv" width="500" height="500"></canvas>
</div>

<script>
/* ----------------- Math helpers ----------------- */
function dot(a,b){ return a[0]*b[0] + a[1]*b[1]; }
function norm(a){ return Math.hypot(a[0], a[1]); }
function add(a,b){ return [a[0]+b[0], a[1]+b[1]]; }
function sub(a,b){ return [a[0]-b[0], a[1]-b[1]]; }
function scale(a,s){ return [a[0]*s, a[1]*s]; }
function unit(a){ const n = norm(a); return n===0 ? [0,0] : [a[0]/n, a[1]/n]; }
function reflect(v, nUnit){ // nUnit outward unit normal
  const vn = dot(v, nUnit);
  return sub(v, scale(nUnit, 2*vn));
}

/* Parse expressions like pi/4, sqrt(2)/5 */
function parseAngle(expr){
  const allowed = { pi: Math.PI, sqrt: Math.sqrt, sin: Math.sin, cos: Math.cos };
  if (!/^[0-9+\-*/().\s a-zA-Z]+$/.test(expr)) {
    throw new Error("Angle contains invalid characters.");
  }
  expr = expr.replace(/\bPI\b/g, "pi").replace(/\bPi\b/g, "pi");
  const fn = new Function("pi","sqrt","sin","cos", return (${expr}););
  const val = fn(allowed.pi, allowed.sqrt, allowed.sin, allowed.cos);
  if (!Number.isFinite(val)) throw new Error("Angle did not evaluate to a finite number.");
  return val;
}

/* ----------------- Core: enforce impact angle -----------------
We fix the *first collision point* q on the boundary at (1,0).
At q:
  tangent t = (0,1)
  inward normal  = (-1,0)
We want the OUTGOING direction after the first bounce to be:
  d_out = cos(alpha)*t + sin(alpha)*inward = (-sin a, cos a)
Then the INCOMING direction before the first bounce is the reflection across normal n=(1,0):
  d_in = reflect(d_out, n) = (sin a, cos a)

Now pick an interior start point p0 along the incoming ray:
  p0 = q - s * d_in,  with 0 < s < 2 sin(a) (so p0 stays inside)
This guarantees the first collision is at q and the impact angle is alpha.
*/
function simulateWithInteriorStart(alpha, bounces){
  if (!(alpha > 0 && alpha <= Math.PI/2 + 1e-14)) {
    throw new Error("Angle must be in (0, pi/2].");
  }
  if (!(Number.isInteger(bounces) && bounces >= 1)) {
    throw new Error("Bounces must be a positive integer.");
  }

  const q = [1, 0];         // first collision point on boundary
  const n0 = [1, 0];        // outward normal at q
  const t0 = [0, 1];        // tangent at q
  const inward0 = [-1, 0];  // inward normal at q

  // Desired outgoing direction after first bounce (points into disk)
  const d_out0 = unit(add(scale(t0, Math.cos(alpha)), scale(inward0, Math.sin(alpha)))); // (-sin a, cos a)

  // Incoming direction that will hit q and reflect to d_out0
  const d_in0  = unit(reflect(d_out0, n0)); // (sin a, cos a)

  // Choose an interior start point along incoming ray to q
  // Max distance along the chord inside the disk from q in direction -d_in0 is 2*sin(alpha).
  const sMax = 2 * Math.sin(alpha);
  const s = (0.15 + 0.75*Math.random()) * sMax; // avoid too close to boundary/center
  const p0 = sub(q, scale(d_in0, s));

  // Caustic radius for circular billiard with impact angle alpha (from tangent):
  const causticRadius = Math.cos(alpha);

  // Now run billiard from p0 with velocity d_in0 until first hit (which is q by construction),
  // then continue with reflections.
  let p = p0.slice();
  let d = d_in0.slice();

  const pts = [p.slice(), q.slice()];

  // Set state right after first collision (outgoing direction)
  d = d_out0.slice();
  p = q.slice();

  for (let i=1; i<bounces; i++){
    // next hit: t = -2 (p·d) since |p|=1 and |d|=1
    const pd = dot(p, d);
    let tau = -2 * pd;
    if (tau <= 1e-12) tau = 1e-12;

    const qNext = add(p, scale(d, tau));
    const n = unit(qNext);
    d = unit(reflect(d, n));
    p = qNext;
    pts.push(p.slice());
  }

  return { pts, causticRadius };
}

/* ----------------- Arc-length parameterization ----------------- */
function buildArc(pts){
  const s = new Array(pts.length).fill(0);
  let total = 0;
  for (let i=1; i<pts.length; i++){
    const dx = pts[i][0] - pts[i-1][0];
    const dy = pts[i][1] - pts[i-1][1];
    total += Math.hypot(dx, dy);
    s[i] = total;
  }
  return { s, total: Math.max(total, 1e-12) };
}

function pointAtArc(pts, sArr, total, u){
  const t = Math.min(Math.max(u, 0), total);
  let i = 1;
  while (i < sArr.length && sArr[i] < t) i++;
  if (i >= sArr.length) return pts[pts.length - 1];

  const s0 = sArr[i-1], s1 = sArr[i];
  const segLen = s1 - s0;
  const w = segLen > 0 ? (t - s0) / segLen : 0;

  const p0 = pts[i-1], p1 = pts[i];
  return [p0[0] + w*(p1[0]-p0[0]), p0[1] + w*(p1[1]-p0[1])];
}

function tracedPrefix(pts, sArr, u){
  const out = [pts[0]];
  if (u <= 0) return out;

  let i = 1;
  while (i < sArr.length && sArr[i] <= u){
    out.push(pts[i]);
    i++;
  }
  if (i >= sArr.length) return out;

  const s0 = sArr[i-1], s1 = sArr[i];
  const segLen = s1 - s0;
  const w = segLen > 0 ? (u - s0) / segLen : 0;
  const p0 = pts[i-1], p1 = pts[i];
  out.push([p0[0] + w*(p1[0]-p0[0]), p0[1] + w*(p1[1]-p0[1])]);
  return out;
}

/* ----------------- Drawing ----------------- */
function draw(state){
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;

  const pad = 40;
  const cx = W/2, cy = H/2;
  const Rpx = Math.min(W, H)/2 - pad;

  function toXY(p){ return [cx + p[0]*Rpx, cy - p[1]*Rpx]; }

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,W,H);

  // boundary
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, Rpx, 0, 2*Math.PI);
  ctx.stroke();

  if (!state) return;

  // caustic (green)
  ctx.strokeStyle = "green";
  ctx.lineWidth = 2.5;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  ctx.arc(cx, cy, state.causticRadius*Rpx, 0, 2*Math.PI);
  ctx.stroke();
  ctx.setLineDash([]);

  // traced orbit so far (blue)
  const traced = tracedPrefix(state.pts, state.arcS, Math.min(state.u, state.arcTotal));
  ctx.strokeStyle = "blue";
  ctx.lineWidth = 2;
  ctx.beginPath();
  let [x0,y0] = toXY(traced[0]);
  ctx.moveTo(x0,y0);
  for (let i=1; i<traced.length; i++){
    const [x,y] = toXY(traced[i]);
    ctx.lineTo(x,y);
  }
  ctx.stroke();

  // particle (red)
  const pos = pointAtArc(state.pts, state.arcS, state.arcTotal, state.u);
  const [px, py] = toXY(pos);
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(px, py, 8, 0, 2*Math.PI);
  ctx.fill();
}

/* ----------------- Animation loop ----------------- */
let state = null;
let lastT = null;

function rebuild(){
  const errEl = document.getElementById("err");
  errEl.textContent = "";

  try{
    const alpha = parseAngle(document.getElementById("angle").value.trim());
    const bounces = parseInt(document.getElementById("bounces").value, 10);
    const speed = Math.max(0, parseFloat(document.getElementById("speed").value || "0.9"));

    const sim = simulateWithInteriorStart(alpha, bounces);
    const arc = buildArc(sim.pts);

    state = {
      pts: sim.pts,
      causticRadius: sim.causticRadius,
      arcS: arc.s,
      arcTotal: arc.total,
      u: 0,
      speed
    };

    draw(state);
  } catch(e){
    state = null;
    errEl.textContent = e.message || String(e);
    draw(null);
  }
}

function tick(t){
  if (lastT == null) lastT = t;
  const dt = (t - lastT)/1000;
  lastT = t;

  if (state){
    const speed = Math.max(0, parseFloat(document.getElementById("speed").value || "0.9"));
    state.u += speed * dt;

    // Stop once fully traced (comment this block to loop)
    if (state.u > state.arcTotal) state.u = state.arcTotal;

    draw(state);
  }
  requestAnimationFrame(tick);
}

/* ----------------- Wire UI ----------------- */
document.getElementById("drawBtn").addEventListener("click", rebuild);
document.getElementById("angle").addEventListener("keydown", (ev)=>{ if(ev.key==="Enter") rebuild(); });
document.getElementById("bounces").addEventListener("keydown", (ev)=>{ if(ev.key==="Enter") rebuild(); });
document.getElementById("speed").addEventListener("keydown", (ev)=>{ if(ev.key==="Enter") rebuild(); });

/* Start */
rebuild();
requestAnimationFrame(tick);
</script>
</body>
</html>
